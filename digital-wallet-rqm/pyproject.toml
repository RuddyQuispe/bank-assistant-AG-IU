[project]
name = "digital-wallet-rqm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RuddyQuispe", email = "ruddyq18@gmail.com" }
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "dotenv>=0.9.9",
    "langchain[google-genai]>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy[asyncio]>=2.1.4",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langgraph-checkpoint-postgres>=3.1.3",
    "fastapi[standard]>=0.162.0",
    "pypdf>=6.21.2",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "scalar-fastapi>=1.9.1",
    "ag-ui-langgraph==0.0.47",
    "copilotkit==0.1.96",
    "aiosqlite==0.22.1",
]

[project.scripts]
digital-wallet-rqm = "digital_wallet_rqm:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["digital_wallet_rqm"]

[[tool.mypy.overrides]]
module = ["langchain_chroma.*", "langchain_google_genai.*", "langchain_community.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI usa Depends(...) como valor por defecto de los parámetros
extend-immutable-calls = ["fastapi.Depends"]
