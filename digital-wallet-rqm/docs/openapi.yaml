openapi: 3.1.0
info:
  title: Digital Wallet RAG
  description: Asistente de banca móvil con RAG sobre documentos de bancos de Bolivia.
  version: 0.1.0
paths:
  /auth/token:
    post:
      tags:
      - auth
      summary: Obtener un token
      description: 'Login de demo: entrega un JWT al usuario de demo. No pide contraseña.


        Enviar el token en el resto de los endpoints con el header `Authorization:
        Bearer <token>`.'
      operationId: create_token_auth_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Falta el token, es inválido o el usuario no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /chat:
    post:
      tags:
      - chat
      summary: Preguntar al agente
      description: Si no se envía `session_id`, se crea una sesión nueva y se devuelve
        su id.
      operationId: ask_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '401':
          description: Falta el token, es inválido o el usuario no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La sesión pertenece a otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /chat/sessions:
    get:
      tags:
      - chat
      summary: Listar sesiones
      description: Devuelve los ids de las sesiones del usuario del token.
      operationId: list_sessions_chat_sessions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response List Sessions Chat Sessions Get
        '401':
          description: Falta el token, es inválido o el usuario no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La sesión pertenece a otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /chat/sessions/{session_id}/history:
    get:
      tags:
      - chat
      summary: Historial de una sesión
      description: Devuelve los mensajes de la sesión en orden.
      operationId: get_history_chat_sessions__session_id__history_get
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponse'
                title: Response Get History Chat Sessions  Session Id  History Get
        '401':
          description: Falta el token, es inválido o el usuario no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La sesión pertenece a otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /chat/sessions/{session_id}:
    delete:
      tags:
      - chat
      summary: Eliminar una sesión
      description: Elimina la sesión y todo su historial.
      operationId: delete_session_chat_sessions__session_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Falta el token, es inválido o el usuario no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La sesión pertenece a otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/index:
    post:
      tags:
      - admin
      summary: Indexar documentos
      description: 'Carga la carpeta de documentos en la base vectorial. **Gasta tokens
        de embedding.**


        Por defecto guarda o actualiza los chunks; con `rebuild=true` vacía la colección
        antes de cargar.'
      operationId: index_documents_admin_index_post
      security:
      - HTTPBearer: []
      parameters:
      - name: rebuild
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Rebuild
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
        '401':
          description: Falta el token, es inválido o el usuario no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agents/wallet:
    post:
      tags:
      - agents
      summary: Correr el agente por AG-UI (streaming)
      description: '`threadId` es la sesión: si es de otro usuario responde 403 antes
        de abrir el stream.'
      operationId: run_wallet_agent_agents_wallet_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunAgentInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: Falta el token, es inválido o el usuario no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La sesión pertenece a otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    ActivityMessage:
      properties:
        subagentRunId:
          anyOf:
          - type: string
          - type: 'null'
          title: Subagentrunid
        id:
          type: string
          title: Id
        role:
          type: string
          const: activity
          title: Role
          default: activity
        activityType:
          type: string
          title: Activitytype
        content:
          additionalProperties: true
          type: object
          title: Content
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
      additionalProperties: true
      type: object
      required:
      - id
      - activityType
      - content
      title: ActivityMessage
      description: 'Structured progress that is not conversation content, materialised
        as a

        message so it keeps its place in the sequence. Stands alone rather than

        composing BaseMessage, because its content is an object rather than a

        string.'
    AssistantMessage:
      properties:
        subagentRunId:
          anyOf:
          - type: string
          - type: 'null'
          title: Subagentrunid
        id:
          type: string
          title: Id
        role:
          type: string
          const: assistant
          title: Role
          default: assistant
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        encryptedValue:
          anyOf:
          - type: string
          - type: 'null'
          title: Encryptedvalue
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
        toolCalls:
          anyOf:
          - items:
              $ref: '#/components/schemas/ToolCall'
            type: array
          - type: 'null'
          title: Toolcalls
      additionalProperties: true
      type: object
      required:
      - id
      title: AssistantMessage
      description: 'A message from the agent. Content is optional because a turn may
        consist

        only of tool calls.'
    AudioPart:
      properties:
        type:
          type: string
          const: audio
          title: Type
          default: audio
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        source:
          oneOf:
          - $ref: '#/components/schemas/DataSource'
          - $ref: '#/components/schemas/UrlSource'
          - $ref: '#/components/schemas/FileSource'
          title: Source
          discriminator:
            propertyName: type
            mapping:
              data: '#/components/schemas/DataSource'
              file: '#/components/schemas/FileSource'
              url: '#/components/schemas/UrlSource'
        metadata:
          anyOf:
          - {}
          - type: 'null'
          title: Metadata
      additionalProperties: true
      type: object
      required:
      - source
      title: AudioPart
      description: An audio part.
    ChatRequest:
      properties:
        question:
          type: string
          minLength: 1
          title: Question
          examples:
          - ¿Cuánto cuesta el mantenimiento de una tarjeta de crédito?
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
          description: Id de una sesión existente; si se omite se crea una nueva
      type: object
      required:
      - question
      title: ChatRequest
    ChatResponse:
      properties:
        session_id:
          type: string
          title: Session Id
          examples:
          - 3f6c1c2e-8a1b-4c9e-9f2a-1d2e3f4a5b6c
        response:
          type: string
          title: Response
          examples:
          - Respuesta del asistente con las fuentes citadas al final.
      type: object
      required:
      - session_id
      - response
      title: ChatResponse
    Context:
      properties:
        description:
          type: string
          title: Description
        value:
          type: string
          title: Value
      additionalProperties: true
      type: object
      required:
      - description
      - value
      title: Context
      description: 'A named piece of ambient information given to the agent for the
        run,

        distinct from the conversation.'
    DataSource:
      properties:
        type:
          type: string
          const: data
          title: Type
          default: data
        value:
          type: string
          title: Value
        mimeType:
          type: string
          title: Mimetype
      additionalProperties: true
      type: object
      required:
      - value
      - mimeType
      title: DataSource
      description: Bytes carried inline.
    DeveloperMessage:
      properties:
        subagentRunId:
          anyOf:
          - type: string
          - type: 'null'
          title: Subagentrunid
        id:
          type: string
          title: Id
        role:
          type: string
          const: developer
          title: Role
          default: developer
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        encryptedValue:
          anyOf:
          - type: string
          - type: 'null'
          title: Encryptedvalue
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        content:
          type: string
          title: Content
      additionalProperties: true
      type: object
      required:
      - id
      - content
      title: DeveloperMessage
      description: Instructions from the application developer.
    DocumentPart:
      properties:
        type:
          type: string
          const: document
          title: Type
          default: document
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        source:
          oneOf:
          - $ref: '#/components/schemas/DataSource'
          - $ref: '#/components/schemas/UrlSource'
          - $ref: '#/components/schemas/FileSource'
          title: Source
          discriminator:
            propertyName: type
            mapping:
              data: '#/components/schemas/DataSource'
              file: '#/components/schemas/FileSource'
              url: '#/components/schemas/UrlSource'
        metadata:
          anyOf:
          - {}
          - type: 'null'
          title: Metadata
      additionalProperties: true
      type: object
      required:
      - source
      title: DocumentPart
      description: A document part.
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: ErrorResponse
    FileSource:
      properties:
        type:
          type: string
          const: file
          title: Type
          default: file
        value:
          type: string
          title: Value
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
        mimeType:
          anyOf:
          - type: string
          - type: 'null'
          title: Mimetype
      additionalProperties: true
      type: object
      required:
      - value
      title: FileSource
      description: 'Bytes already at the provider, named by a handle the provider
        issued: an

        OpenAI or Anthropic file id, a Gemini file URI, a storage URL only that

        provider can read. No bytes travel and nothing is fetched. Only the

        provider that minted the handle can resolve it; a peer that cannot drops

        the part as it drops any part it cannot use.'
    FunctionCall:
      properties:
        name:
          type: string
          title: Name
        arguments:
          type: string
          title: Arguments
      additionalProperties: true
      type: object
      required:
      - name
      - arguments
      title: FunctionCall
      description: The name and arguments of a tool call.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImagePart:
      properties:
        type:
          type: string
          const: image
          title: Type
          default: image
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        source:
          oneOf:
          - $ref: '#/components/schemas/DataSource'
          - $ref: '#/components/schemas/UrlSource'
          - $ref: '#/components/schemas/FileSource'
          title: Source
          discriminator:
            propertyName: type
            mapping:
              data: '#/components/schemas/DataSource'
              file: '#/components/schemas/FileSource'
              url: '#/components/schemas/UrlSource'
        metadata:
          anyOf:
          - {}
          - type: 'null'
          title: Metadata
      additionalProperties: true
      type: object
      required:
      - source
      title: ImagePart
      description: An image part.
    IndexResponse:
      properties:
        chunks:
          type: integer
          title: Chunks
          description: Cantidad de chunks en la colección
          examples:
          - 384
      type: object
      required:
      - chunks
      title: IndexResponse
    MessageResponse:
      properties:
        role:
          type: string
          title: Role
          description: human o ai
          examples:
          - human
        content:
          type: string
          title: Content
          examples:
          - ¿Cuánto cuesta el mantenimiento de una tarjeta de crédito?
      type: object
      required:
      - role
      - content
      title: MessageResponse
    ReasoningMessage:
      properties:
        subagentRunId:
          anyOf:
          - type: string
          - type: 'null'
          title: Subagentrunid
        id:
          type: string
          title: Id
        role:
          type: string
          const: reasoning
          title: Role
          default: reasoning
        content:
          type: string
          title: Content
        encryptedValue:
          anyOf:
          - type: string
          - type: 'null'
          title: Encryptedvalue
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
      additionalProperties: true
      type: object
      required:
      - id
      - content
      title: ReasoningMessage
      description: 'A span of the agent''s reasoning, materialised as a message. Stands
        alone

        rather than composing BaseMessage, because it carries no name.'
    ResumeEntry:
      properties:
        interruptId:
          type: string
          title: Interruptid
        status:
          type: string
          enum:
          - resolved
          - cancelled
          title: Status
        payload:
          anyOf:
          - {}
          - type: 'null'
          title: Payload
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
      additionalProperties: true
      type: object
      required:
      - interruptId
      - status
      title: ResumeEntry
      description: An answer to one interrupt, sent on the run that continues from
        it.
    RunAgentInput:
      properties:
        threadId:
          type: string
          title: Threadid
        runId:
          type: string
          title: Runid
        protocolVersion:
          anyOf:
          - type: string
          - type: 'null'
          title: Protocolversion
        parentRunId:
          anyOf:
          - type: string
          - type: 'null'
          title: Parentrunid
        state:
          anyOf:
          - {}
          - type: 'null'
          title: State
        messages:
          items:
            oneOf:
            - $ref: '#/components/schemas/DeveloperMessage'
            - $ref: '#/components/schemas/SystemMessage'
            - $ref: '#/components/schemas/AssistantMessage'
            - $ref: '#/components/schemas/UserMessage'
            - $ref: '#/components/schemas/ToolMessage'
            - $ref: '#/components/schemas/ActivityMessage'
            - $ref: '#/components/schemas/ReasoningMessage'
            discriminator:
              propertyName: role
              mapping:
                activity: '#/components/schemas/ActivityMessage'
                assistant: '#/components/schemas/AssistantMessage'
                developer: '#/components/schemas/DeveloperMessage'
                reasoning: '#/components/schemas/ReasoningMessage'
                system: '#/components/schemas/SystemMessage'
                tool: '#/components/schemas/ToolMessage'
                user: '#/components/schemas/UserMessage'
          type: array
          title: Messages
        tools:
          anyOf:
          - items:
              $ref: '#/components/schemas/Tool'
            type: array
          - type: 'null'
          title: Tools
        context:
          anyOf:
          - items:
              $ref: '#/components/schemas/Context'
            type: array
          - type: 'null'
          title: Context
        forwardedProps:
          anyOf:
          - {}
          - type: 'null'
          title: Forwardedprops
        resume:
          anyOf:
          - items:
              $ref: '#/components/schemas/ResumeEntry'
            type: array
          - type: 'null'
          title: Resume
      additionalProperties: true
      type: object
      required:
      - threadId
      - runId
      - messages
      title: RunAgentInput
      description: 'A request to run an agent. Also echoed back as RUN_STARTED.input.
        Only

        threadId, runId and messages are required: those are the three the SDKs

        already agree on, and for tools and context an absent key and an empty

        array mean the same thing, so requiring them would catch nothing a

        producer could get wrong.'
    SystemMessage:
      properties:
        subagentRunId:
          anyOf:
          - type: string
          - type: 'null'
          title: Subagentrunid
        id:
          type: string
          title: Id
        role:
          type: string
          const: system
          title: Role
          default: system
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        encryptedValue:
          anyOf:
          - type: string
          - type: 'null'
          title: Encryptedvalue
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        content:
          type: string
          title: Content
      additionalProperties: true
      type: object
      required:
      - id
      - content
      title: SystemMessage
      description: Instructions from the system.
    TextPart:
      properties:
        type:
          type: string
          const: text
          title: Type
          default: text
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        text:
          type: string
          title: Text
        metadata:
          anyOf:
          - {}
          - type: 'null'
          title: Metadata
      additionalProperties: true
      type: object
      required:
      - text
      title: TextPart
      description: A text part.
    TokenRequest:
      properties:
        nickname:
          type: string
          minLength: 1
          title: Nickname
          examples:
          - ruddy
      type: object
      required:
      - nickname
      title: TokenRequest
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
          examples:
          - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          title: Token Type
          default: bearer
      type: object
      required:
      - access_token
      title: TokenResponse
    Tool:
      properties:
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        parameters:
          anyOf:
          - {}
          - type: 'null'
          title: Parameters
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
      additionalProperties: true
      type: object
      required:
      - name
      - description
      title: Tool
      description: A tool the agent may call.
    ToolCall:
      properties:
        id:
          type: string
          title: Id
        type:
          type: string
          const: function
          title: Type
          default: function
        function:
          $ref: '#/components/schemas/FunctionCall'
        encryptedValue:
          anyOf:
          - type: string
          - type: 'null'
          title: Encryptedvalue
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
      additionalProperties: true
      type: object
      required:
      - id
      - function
      title: ToolCall
      description: 'A call an assistant message made. Carries no subagent attribution
        of its

        own and inherits its containing message''s, since several calls can share

        one parent.'
    ToolMessage:
      properties:
        subagentRunId:
          anyOf:
          - type: string
          - type: 'null'
          title: Subagentrunid
        id:
          type: string
          title: Id
        role:
          type: string
          const: tool
          title: Role
          default: tool
        content:
          anyOf:
          - type: string
          - items:
              oneOf:
              - $ref: '#/components/schemas/TextPart'
              - $ref: '#/components/schemas/ImagePart'
              - $ref: '#/components/schemas/AudioPart'
              - $ref: '#/components/schemas/VideoPart'
              - $ref: '#/components/schemas/DocumentPart'
              discriminator:
                propertyName: type
                mapping:
                  audio: '#/components/schemas/AudioPart'
                  document: '#/components/schemas/DocumentPart'
                  image: '#/components/schemas/ImagePart'
                  text: '#/components/schemas/TextPart'
                  video: '#/components/schemas/VideoPart'
            type: array
          title: Content
        toolCallId:
          type: string
          title: Toolcallid
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        encryptedValue:
          anyOf:
          - type: string
          - type: 'null'
          title: Encryptedvalue
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
      additionalProperties: true
      type: object
      required:
      - id
      - content
      - toolCallId
      title: ToolMessage
      description: 'What a tool returned, as a message in the conversation. Stands
        alone

        rather than composing BaseMessage, because it carries no name.'
    UrlSource:
      properties:
        type:
          type: string
          const: url
          title: Type
          default: url
        value:
          type: string
          title: Value
        mimeType:
          anyOf:
          - type: string
          - type: 'null'
          title: Mimetype
      additionalProperties: true
      type: object
      required:
      - value
      title: UrlSource
      description: Bytes referenced by URL, fetched by whoever needs them.
    UserMessage:
      properties:
        subagentRunId:
